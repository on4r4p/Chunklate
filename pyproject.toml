[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chunklate"
version = "0.1.0"
description = "PNG corruption analyzer and repair helper."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4.6",
    "ImageHash>=4.3",
    "inputimeout>=1.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/on4r4p/Chunklate"
Repository = "https://github.com/on4r4p/Chunklate"
Issues = "https://github.com/on4r4p/Chunklate/issues"

[project.optional-dependencies]
gpu = [
    "moderngl>=5.10",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.4",
    "twine>=5.0",
]

[project.scripts]
chunklate = "Chunklate:main"

[tool.setuptools]
py-modules = ["Chunklate"]
packages = ["chunklate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
