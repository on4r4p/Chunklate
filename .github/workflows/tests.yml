name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Smoke CLI help
        run: python Chunklate.py -h

      - name: Smoke valid PNG
        run: python Chunklate.py -stfu -f schaik-javapng-samples/basn0g01.png --output-dir smoke-out

      - name: Smoke repair PNG
        run: python Chunklate.py -a -stfu --max-saves 1 -f schaik-javapng-samples/brokenjavapngsuite/phys_unit_specifier.png --output-dir smoke-repair
